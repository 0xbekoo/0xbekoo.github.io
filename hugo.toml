#
#
# Main Information
#
#

baseURL = "https://0xbekoo.github.io/"
title = "0xbekoo"
theme = "rewired"

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[taxonomies]
  tag = "tags"
  category = "categories"

[pagination]
  pagerSize = 10

[params]
  blogPageSize = 5

[params.toc]
  enabled = true
  ordered = false
  startLevel = 1
  endLevel = 3

[caches]
  [caches.images]
    dir = ":cacheDir/images"

[languages]

[languages.en]
  label = "English"
  locale = "en-US"
  weight = 1
  contentDir = "content/en"
  title = "0xbekoo"

[languages.en.params]
  author = "0xbekoo"
  descriptionLines = [
    "Bootkit Development",
  ]
  tagline = "Deneme"

[languages.en.params.footer]
  text = 'rewired // made with ♥ and [Hugo](https://gohugo.io/)'
  prompt = "root@stuxnet:~$"

[[languages.en.menus.main]]
  name = "home"
  pageRef = "/"
  weight = 10

[[languages.en.menus.main]]
  name = "blog"
  pageRef = "/posts"
  weight = 20

[[languages.en.menus.main]]
  name = "projects"
  pageRef = "/projects"
  weight = 30

[[languages.en.menus.main]]
  name = "about"
  pageRef = "/about"
  weight = 40

[[languages.en.params.social]]
  name = "GitHub"
  url = "https://github.com/0xbekoo"
  icon = "fa-brands fa-github"

[[languages.en.params.social]]
  name = "Medium"
  url = "https://medium.com/@0xbekoo"
  icon = "fa-brands fa-medium"

[[languages.en.params.social]]
  name = "DEV"
  url = "https://dev.to/bekoo"
  icon = "fa-brands fa-dev"

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]
